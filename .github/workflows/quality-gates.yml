name: HMTc quality gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmtc-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source, build, and rendered acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce the design-source canon
        run: node tools/design-lint.mjs

      - name: Type-check
        run: npm run check

      - name: Generate and build the complete site
        run: npm run build

      - name: Install the rendered-test browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Verify computed styles against the v3 acceptance specification
        run: npm run check:v3
